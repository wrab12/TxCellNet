# Read the Docs configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html)
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

# The tutorials are notebooks stored with their outputs (rendered without execution) and the API page mocks torch,
# so the build installs only the documentation requirements.
sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt
